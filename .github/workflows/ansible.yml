name: Ansible

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint (production profile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: pip install "ansible-core==2.21.5" "ansible-lint==26.10.1" boto3

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        run: ansible-lint --profile production

      - name: Syntax check
        run: ansible-playbook -i localhost, --syntax-check site.yml patch.yml
