---
cloudwatch_agent_log_group_prefix: /ec2/ecs-platform
cloudwatch_agent_config_path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
cloudwatch_agent_config:
  agent:
    metrics_collection_interval: 60
    run_as_user: root # needed to read /var/log/audit/audit.log
  metrics:
    namespace: CWAgent
    append_dimensions:
      InstanceId: "${aws:InstanceId}"
    metrics_collected:
      mem:
        measurement: [mem_used_percent]
      disk:
        measurement: [used_percent]
        resources: ["/"]
  logs:
    logs_collected:
      files:
        collect_list:
          - file_path: /var/log/audit/audit.log
            log_group_name: "{{ cloudwatch_agent_log_group_prefix }}/audit"
            log_stream_name: "{instance_id}"
            retention_in_days: 30
          - file_path: /var/log/dnf.rpm.log
            log_group_name: "{{ cloudwatch_agent_log_group_prefix }}/package-changes"
            log_stream_name: "{instance_id}"
            retention_in_days: 30
