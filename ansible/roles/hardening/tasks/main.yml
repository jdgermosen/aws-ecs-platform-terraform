---
# SSH stays installed for break-glass use, but access normally goes through SSM.
- name: Harden the SSH daemon
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Apply kernel network and information-leak hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    state: present
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Install audit rules for identity, privilege, and SSH changes
  ansible.builtin.copy:
    src: 50-hardening.rules
    dest: /etc/audit/rules.d/50-hardening.rules
    owner: root
    group: root
    mode: "0600"
  notify: Load audit rules

- name: Keep auditd running
  ansible.builtin.systemd_service:
    name: auditd
    state: started
    enabled: true
