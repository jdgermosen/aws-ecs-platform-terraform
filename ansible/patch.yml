---
# Rolling security patching, one host at a time.
# Amazon Linux 2023 locks each host to a release version, so security updates are taken from
# the latest release (releasever=latest) rather than only the version the AMI shipped with.
- name: Apply security updates
  hosts: role_ops
  become: true
  serial: 1
  vars:
    patch_releasever: latest
  tasks:
    - name: Install security updates
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
        update_only: true
        releasever: "{{ patch_releasever }}"
      register: patch_result

    - name: Check whether a reboot is required
      ansible.builtin.command: dnf needs-restarting --reboothint
      register: needs_reboot
      changed_when: false
      failed_when: needs_reboot.rc not in [0, 1]

    - name: Reboot when the kernel or core libraries changed
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: needs_reboot.rc == 1

    - name: Report what changed
      ansible.builtin.debug:
        msg: "{{ patch_result.results | default([]) | length }} package transactions; reboot {{ 'performed' if needs_reboot.rc == 1 else 'not needed' }}"
