---
- name: Install the CloudWatch agent
  ansible.builtin.dnf:
    name: amazon-cloudwatch-agent
    state: present

- name: Configure metrics and log collection
  ansible.builtin.template:
    src: amazon-cloudwatch-agent.json.j2
    dest: "{{ cloudwatch_agent_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload CloudWatch agent

- name: Keep the CloudWatch agent running
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    state: started
    enabled: true
